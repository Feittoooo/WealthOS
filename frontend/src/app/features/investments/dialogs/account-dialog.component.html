<app-modal [open]="open()" (closed)="closed.emit()"
           [title]="(account() ? 'inv.editAccount' : 'inv.newAccount') | t"
           [subtitle]="'inv.accountDialogText' | t">
  <form class="dialog__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="dialog__body form">
      <app-form-error [error]="error()" />

      <label class="field">
        <span>{{ 'form.name' | t }}</span>
        <input formControlName="name" maxlength="80" autocomplete="off" [placeholder]="'form.accountNamePh' | t">
      </label>

      <div class="field">
        <span>{{ 'form.type' | t }}</span>
        <app-segmented formControlName="type" [options]="typeOptions" />
      </div>

      <div class="form-row">
        <label class="field">
          <span>{{ 'form.institution' | t }} <em>{{ 'form.optional' | t }}</em></span>
          <input formControlName="institution" maxlength="80" autocomplete="off">
        </label>
        <label class="field">
          <span>{{ 'form.currency' | t }}</span>
          <select formControlName="currency">
            @for (c of currencies; track c) { <option [value]="c">{{ c }}</option> }
          </select>
        </label>
      </div>

      <label class="field">
        <span>{{ 'form.cashBalance' | t }}</span>
        <input type="number" step="0.01" formControlName="balance" class="num">
        <small>{{ 'form.cashBalanceHint' | t }}</small>
      </label>
    </div>

    <div class="dialog__footer">
      <button type="button" class="button" (click)="closed.emit()">{{ 'common.cancel' | t }}</button>
      <button type="submit" class="button button--primary" [disabled]="saving()">{{ 'common.save' | t }}</button>
    </div>
  </form>
</app-modal>
