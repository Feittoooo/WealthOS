<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WealthOS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // set the theme before Angular boots so there's no flash of the wrong colours
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('wealthos-theme') || 'dark'; } catch (e) { }
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
