spring.application.name=wealthos

# --- Database (embedded H2, file-based, persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/wealthos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console at /h2-console (JDBC URL jdbc:h2:file:./data/wealthos, user sa).
# H2 refuses connections from other machines (web-allow-others=false).
spring.h2.console.enabled=true

# --- Server
# Railway and most hosts inject PORT; locally it's 8080.
server.port=${PORT:8080}
server.compression.enabled=true
server.error.include-message=never

# Text for the API and the frontend: messages.properties (English) and messages_es.properties
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# --- Logging. The request id ties together browser, server log and error responses.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-main}] %logger{36} - %msg%n
logging.level.com.wealthos=INFO

# --- Actuator: only what Railway needs for health checks
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=true

# --- API docs at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# --- WealthOS
# How amounts are written in activity log entries (es-ES -> 1.234,56 EUR).
wealthos.locale=es-ES
wealthos.base-currency=EUR
# Optional HTTP Basic auth. Empty password = no login (fine on localhost).
# Set WEALTHOS_PASSWORD on any public deployment.
wealthos.auth.username=${WEALTHOS_USERNAME:admin}
wealthos.auth.password=${WEALTHOS_PASSWORD:}
# In-app debug page (/debug) and /api/debug. Shows logs and config: turn off on public deployments.
wealthos.debug.enabled=${WEALTHOS_DEBUG:true}
# Market prices. "none" until issue #1 adds a real source (see PriceProvider).
wealthos.prices.provider=${WEALTHOS_PRICES:none}
# When locked positions get their price refreshed (weekdays after the markets close)
wealthos.prices.refresh-cron=0 30 22 * * MON-FRI
